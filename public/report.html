<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Draft report · Minnesota Madness</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d10;--panel:#151920;--line:#29303a;--text:#f2f5f7;--muted:#a8b3bf;--accent:#70e1a1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:28px}a{color:var(--accent)}h1{font-size:clamp(28px,5vw,44px);margin:12px 0 0;letter-spacing:-1px}h2{margin:0 0 12px;font-size:23px}h3{margin:0;font-size:17px}p{margin:8px 0 16px}.muted{color:var(--muted)}.notice{border-left:3px solid #ffc857;padding:12px 18px;background:#211e17;border-radius:4px;margin:24px 0}.panel{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:22px;margin:24px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:center;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:12px}th:first-child,td:first-child{text-align:left}tbody tr:hover{background:#1b242b}.grade{font-weight:750;font-size:20px}.hero-grade{font-size:46px;color:var(--accent);line-height:1}.team-heading{display:flex;justify-content:space-between;align-items:center;gap:20px}.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}.category{padding:18px;background:#10151b;border:1px solid var(--line);border-radius:8px}.grade-pair{display:flex;gap:30px;margin:12px 0}.grade-pair span{display:block;color:var(--muted);font-size:12px}.grade-pair strong{font-size:26px}.category p{font-size:14px;color:var(--muted);margin-bottom:0}summary{cursor:pointer;padding:10px 0;color:var(--accent)}.roster{columns:2;list-style:none;padding:0}.roster li{break-inside:avoid;padding:5px 0}.roster span{display:inline-block;min-width:64px;color:var(--muted);font-size:12px}button,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;color:var(--text);background:var(--panel)}:focus-visible{outline:2px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}footer{color:var(--muted);font-size:13px;margin:30px 0}section{scroll-margin-top:16px}@media(max-width:650px){main{padding:16px}.panel{padding:16px}.categories{grid-template-columns:1fr}.roster{columns:1}th,td{padding:10px 8px}}
  </style>
</head>
<body>
<main>
  <a href="/">← Draft companion</a>
  <h1>The draft, graded.</h1>
  <p class="muted">Minnesota Madness · 2026 · Original drafted rosters</p>
  <p id="status" role="status">Loading the draft report…</p>
  <button id="retry" hidden>Try again</button>
  <div id="report" hidden>
    <div class="notice" id="snapshot"></div>
    <section class="panel" aria-labelledby="league-title">
      <h2 id="league-title">Around the league</h2>
      <p class="muted">Starter grades compare 1 QB, 2 RBs, 3 WRs, and 1 TE per team. Both FLEX slots count toward the overall grade. Select a team for its report.</p>
      <div class="scroll" tabindex="0" role="region" aria-label="League grades, scroll horizontally on small screens">
        <table><thead><tr><th scope="col" rowspan="2">Team</th><th scope="col" rowspan="2">Overall</th><th scope="colgroup" colspan="2">QB</th><th scope="colgroup" colspan="2">RB</th><th scope="colgroup" colspan="2">WR</th><th scope="colgroup" colspan="2">TE</th></tr><tr id="subheaders"></tr></thead><tbody id="teams"></tbody></table>
      </div>
    </section>
    <div id="details"></div>
    <footer id="source"></footer>
  </div>
</main>
<script type="module">
  const $ = selector => document.querySelector(selector);
  const escape = value => String(value ?? "").replace(/[&<>"']/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]));
  const grade = value => escape(value || "Unavailable");
  const date = value => new Date(value).toLocaleString("en-US", {timeZone:"America/Chicago", dateStyle:"medium", timeStyle:"short"}) + " CT";
  async function load() {
    $("#retry").hidden = true;
    $("#status").textContent = "Loading the draft report…";
    try {
      const response = await fetch("/api/draft-report");
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "The report could not be loaded.");
      $("#snapshot").textContent = `Original rosters from the draft completed ${date(data.draftEndedAt)}. Evaluated using information retrieved ${date(data.evaluatedAt)} because a complete draft-day dataset was unavailable. This is not a draft-day evaluation. ${data.warning ? "This response is incomplete and has not been frozen." : "The evaluation snapshot is frozen; later roster moves and source updates do not change it."}`;
      $("#subheaders").innerHTML = Array(4).fill('<th scope="col">Starters</th><th scope="col">Depth</th>').join("");
      $("#teams").innerHTML = data.teams.map((team,index) => `<tr><th scope="row"><a href="#team-${index}">${escape(team.name)}</a></th><td class="grade">${grade(team.overall)}</td>${team.categories.map(category => `<td>${grade(category.starters)}</td><td>${grade(category.depth)}</td>`).join("")}</tr>`).join("");
      $("#details").innerHTML = data.teams.map((team,index) => `<section class="panel" id="team-${index}" aria-labelledby="heading-${index}"><div class="team-heading"><div><h2 id="heading-${index}">${escape(team.name)}</h2><span class="muted">Overall roster grade</span></div><strong class="hero-grade">${grade(team.overall)}</strong></div><p>${escape(team.summary)}</p>${team.missing.length ? `<p>Missing projections: ${team.missing.map(escape).join(", ")}</p>` : ""}<div class="categories">${team.categories.map(category => `<article class="category"><h3>${category.position}</h3><div class="grade-pair"><div><span>Starters</span><strong>${grade(category.starters)}</strong></div><div><span>Depth</span><strong>${grade(category.depth)}</strong></div></div><p>${escape(category.explanation)}</p></article>`).join("")}</div><h3 style="margin-top:20px">Risk and outlook</h3><ul>${team.risks.map(risk => `<li>${escape(risk)}</li>`).join("")}</ul><p class="muted">${escape(team.uncertainty)}</p><details><summary>View drafted roster</summary><ul class="roster">${team.roster.map(player => `<li><span>${escape(player.slot)}</span> ${escape(player.name)} <small class="muted">${escape(player.position)}</small></li>`).join("")}</ul></details></section>`).join("");
      $("#source").textContent = `Source: ${data.source.name}. ${data.source.horizon}. Retrieved ${date(data.source.fetchedAt)}. League scoring includes the TE reception premium. FLEX players count as starters. Grades are independent estimates, not Footballguys grades or championship probabilities.`;
      $("#status").textContent = data.warning || "";
      $("#report").hidden = false;
    } catch (error) { $("#status").textContent = error.message; $("#retry").hidden = false; }
  }
  $("#retry").addEventListener("click", load);
  load();
</script>
</body>
</html>
